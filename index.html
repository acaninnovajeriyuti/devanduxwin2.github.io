<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Tech Challenge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game">
    <h1>☠ Secret Tech Challenge ☠</h1>

    <!-- Progress Bar -->
    <div id="progress-container">
      <div id="progress-bar"></div>
    </div>
    <p id="progress-text">Progress: 0 / 8</p>

    <!-- Game Output -->
    <div id="output">Choose a path to begin...</div>

    <!-- Main Menu -->
    <div id="main-buttons" class="button-group">
      <button onclick="selectOption('1')">Pre-Hispanic → Car</button>
      <button onclick="selectOption('2')">Internet → iPhone</button>
      <button onclick="selectOption('3')">Android → AI</button>
    </div>

    <!-- Input group -->
    <div id="text-input" class="input-group" style="display:none;">
      <input id="input" type="text" placeholder="Type answer here...">
      <button onclick="submitText()">Submit</button>
    </div>

    <!-- A/B buttons -->
    <div id="choice-buttons" class="button-group" style="display:none;">
      <button id="btn-a" onclick="handleABChoice('a')">a</button>
      <button id="btn-b" onclick="handleABChoice('b')">b</button>
    </div>

    <!-- Exit Button -->
    <div>
      <button id="exit-button" onclick="exitGame()" style="display:none;">Exit</button>
    </div>
  </div>

  <!-- Ambient Music -->
  <audio autoplay loop id="bg-music">
    <source src="ambient.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>
</body>
</html>
