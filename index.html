<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Tech Challenge</title>
  <link rel="icon" href="skull.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>☠ Secret Tech Challenge ☠</h1>
  
  <!-- Lives row -->
  <div id="lives"></div>

  <!-- Progress bar -->
  <div id="progress-container">
    <div id="progress-bar"></div>
  </div>
  <p id="progress-text">Progress: 0/8</p>

  <div id="output">Welcome, traveler... Choose your path carefully!</div>

  <!-- Main menu -->
  <div id="main-buttons" class="btn-group">
    <button onclick="selectOption('1')">1. Pre-Hispanic → Car</button>
    <button onclick="selectOption('2')">2. Internet → iPhone</button>
    <button onclick="selectOption('3')">3. Android → AI</button>
  </div>

  <!-- Input group -->
  <div id="text-input" style="display:none;" class="btn-group">
    <input id="input" type="text" placeholder="Type your answer">
    <button onclick="submitText()">Submit</button>
  </div>

  <!-- A/B buttons -->
  <div id="choice-buttons" style="display:none;" class="btn-group">
    <button id="btn-a" onclick="handleABChoice('a')"></button>
    <button id="btn-b" onclick="handleABChoice('b')"></button>
  </div>

  <!-- Exit -->
  <div class="btn-group">
    <button id="exit-button" onclick="exitGame()" style="display:none;">🚪 Exit</button>
  </div>

  <!-- Ambient music -->
  <audio autoplay loop>
    <source src="ambient.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>
</body>
</html>
